services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wp-autopilot-backend
    restart: unless-stopped
    expose:
      - "3100" # Exposed only inside Docker network, NOT published to host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3100/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wp-autopilot-frontend
    restart: unless-stopped
    expose:
      - "3000" # Exposed only inside Docker network
    environment:
      - BACKEND_API_URL=http://backend:3100
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: wp-autopilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    container_name: wp-autopilot-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
